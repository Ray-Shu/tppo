[project]
name = "tppo"
version = "0.1.0"
dependencies = [
    "ipykernel",
    "jax",
    "flax",
    "distrax",
    "numpy", 
    "gymnax" 
]
requires-python = ">=3.11, <3.12"

[project.optional-dependencies] 
cuda = ["jax[cuda12]>=0.4.38"]  # use --extra cuda

[dependency-groups]
gym = ["gymnasium"]  # --dev gym

[tool.uv]
package = true

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tppo"]
