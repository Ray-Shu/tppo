<svg width="680" height="730" viewBox="0 0 680 730" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>TPPO architecture with GTrXL-style gated block</title>
  <desc>Embedding feeds a stack of L gated transformer blocks (pre-LayerNorm, multi-head attention and position-wise MLP, each followed by a gating layer that combines the residual x with the sublayer output y), then the final hidden state feeds actor and critic heads.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <style>
    .t  { font-size:14px; fill:#1e293b; }
    .th { font-size:14px; font-weight:600; fill:#1e293b; }
    .ts { font-size:12px; fill:#475569; }
    .arr { stroke:#334155; stroke-width:1.5; fill:none; }
    .leader { stroke:#94a3b8; stroke-width:1; fill:none; }
    .box  { fill:#ffffff; stroke:#94a3b8; }
    .coral { fill:#FAECE7; stroke:#D85A30; }
    .teal  { fill:#E1F5EE; stroke:#1D9E75; }
    .blue  { fill:#E6F1FB; stroke:#378ADD; }
    .purple{ fill:#EEEDFE; stroke:#7F77DD; }
  </style>

  <rect class="teal" x="160" y="20" width="110" height="30" rx="8" stroke-width="0.5"/>
  <text class="th" x="215" y="40" text-anchor="middle">Policy &#960;</text>
  <rect class="blue" x="410" y="20" width="110" height="30" rx="8" stroke-width="0.5"/>
  <text class="th" x="465" y="40" text-anchor="middle">Value V</text>
  <line x1="215" y1="70" x2="215" y2="52" class="arr" marker-end="url(#arrow)"/>
  <line x1="465" y1="70" x2="465" y2="52" class="arr" marker-end="url(#arrow)"/>

  <rect class="teal" x="110" y="70" width="210" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="215" y="93" text-anchor="middle">Actor head</text>
  <text class="ts" x="215" y="111" text-anchor="middle">&#960; = Categorical</text>
  <rect class="blue" x="360" y="70" width="210" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="465" y="93" text-anchor="middle">Critic head</text>
  <text class="ts" x="465" y="111" text-anchor="middle">V (value)</text>
  <line x1="340" y1="156" x2="215" y2="124" class="arr" marker-end="url(#arrow)"/>
  <line x1="340" y1="156" x2="465" y2="124" class="arr" marker-end="url(#arrow)"/>

  <rect class="box" x="240" y="160" width="200" height="38" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="184" text-anchor="middle">Final hidden state h&#8348;</text>
  <line x1="340" y1="242" x2="340" y2="200" class="arr" marker-end="url(#arrow)"/>

  <text class="th" x="140" y="214">L&#215;</text>
  <rect x="130" y="220" width="410" height="384" rx="16" fill="none" stroke="#64748b" stroke-width="0.5"/>

  <path d="M340 594 H185 V442 H238" class="leader" marker-end="url(#arrow)"/>
  <path d="M340 414 H155 V258 H238" class="leader" marker-end="url(#arrow)"/>
  <text class="ts" x="232" y="437" text-anchor="end" font-style="italic">x</text>
  <text class="ts" x="232" y="253" text-anchor="end" font-style="italic">x</text>
  <text class="ts" x="352" y="474" font-style="italic">y</text>
  <text class="ts" x="352" y="290" font-style="italic">y</text>

  <rect class="coral" x="240" y="242" width="200" height="32" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="263" text-anchor="middle">Gating layer</text>
  <line x1="340" y1="296" x2="340" y2="276" class="arr" marker-end="url(#arrow)"/>

  <rect class="box" x="240" y="296" width="200" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="320" text-anchor="middle">Position-wise MLP</text>
  <text class="ts" x="340" y="338" text-anchor="middle">relu / gelu / swiglu</text>
  <line x1="340" y1="374" x2="340" y2="354" class="arr" marker-end="url(#arrow)"/>

  <rect class="box" x="240" y="374" width="200" height="30" rx="8" stroke-width="0.5"/>
  <text class="t" x="340" y="394" text-anchor="middle">Layer-norm</text>
  <line x1="340" y1="426" x2="340" y2="406" class="arr" marker-end="url(#arrow)"/>

  <rect class="coral" x="240" y="426" width="200" height="32" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="447" text-anchor="middle">Gating layer</text>
  <line x1="340" y1="480" x2="340" y2="460" class="arr" marker-end="url(#arrow)"/>

  <rect class="box" x="240" y="480" width="200" height="40" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="504" text-anchor="middle">Multi-head attention</text>
  <line x1="340" y1="558" x2="340" y2="522" class="arr" marker-end="url(#arrow)"/>

  <rect class="box" x="240" y="558" width="200" height="30" rx="8" stroke-width="0.5"/>
  <text class="t" x="340" y="578" text-anchor="middle">Layer-norm</text>

  <line x1="340" y1="630" x2="340" y2="590" class="arr" marker-end="url(#arrow)"/>

  <rect class="purple" x="230" y="630" width="220" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="657" text-anchor="middle">Embedding (Linear)</text>
  <line x1="340" y1="706" x2="340" y2="676" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="340" y="722" text-anchor="middle">obs = (observation, last action, last reward)</text>
</svg>
